name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Streamlit app
        run: python -m compileall -q -f "AgriSens/CROP-RECOMMENDATION/webapp.py"
